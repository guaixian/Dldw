# ============================================================================
# dldw 服务端配置（带注释模板）
#
# 用法：  dldw serve --config /etc/dldw/server.yaml
# 格式：  YAML 子集（缩进嵌套 / 标量 / [a, b] 内联列表 / # 注释），
#         也支持 JSON（同名字段，见 internal/server/app/config.go 的 json tag）。
# 加载：  Default(配置文件目录) 打底 -> 本文件覆盖 -> 空缺路径基于 data_dir 补全。
# 热更：  whitelist_file 修改后约 30s 内自动重载；其余字段需重启进程。
# ============================================================================

# ----------------------------------------------------------------------------
# 网络：控制 API（/healthz /readyz /api/v1/... /files/）
# ----------------------------------------------------------------------------
listen: 127.0.0.1:8080        # 监听地址；对外服务改 0.0.0.0:8080 并配 TLS/反代
public_base: http://127.0.0.1:8080
# 对外可见的基础 URL。localfs 驱动的预签名下载 URL 会拼在它后面
# （<public_base>/files/<key>?exp=..&sig=..）。生产环境填
# https://dldw.example.com 这样的真实域名，客户端才能访问到。

tls:                          # 控制 API 的 TLS（可选；也可用 nginx/caddy 终结）
  cert: ""                    # PEM 证书路径，如 /etc/dldw/tls/fullchain.pem
  key: ""                     # PEM 私钥路径；两者都为空 = 明文监听

# ----------------------------------------------------------------------------
# DLDW/1 受控出口隧道（spec 4.2）
#
# !! 端口约定：客户端按 server URL 推导隧道地址——URL 显式端口 P -> P+1；
# !! https 默认 4443，http 默认 8081。修改本端口需同步调整客户端用法。
# ----------------------------------------------------------------------------
tunnel:
  enabled: true
  listen: 127.0.0.1:8081      # 对外服务改 0.0.0.0:8081
  # mode: whitelist_only      # 默认：仅白名单域名（dldw 语义）
  mode: whitelist_only
  # relay_all：任意公网域名中转（dldc/dldw relay 语义），SSRF/端口/令牌/限额不变
  # mode: relay_all
  tls:                        # 生产环境必须启用（令牌/数据否则明文传输）
    cert: ""                  # 如 /etc/dldw/tls/tunnel-fullchain.pem
    key: ""                   # 如 /etc/dldw/tls/tunnel-privkey.pem
  # upstream_proxy: http://127.0.0.1:10808
  # 可选：隧道出口经上游 HTTP 代理（如 Xray/v2rayN 的 mixed 入站）出网。
  # 启用后：目标 DNS/SSRF 判定委托给代理；域名白名单与端口策略仍本地强制，
  # OK 应答的 resolved_ip 报 "-"。
  max_conns_per_token: 16     # 每个设备 token 的并发隧道连接上限
  max_bytes_per_conn: 256MiB  # 单连接字节上限；隧道不承载大文件（大文件走 dldw get）
  idle_timeout: 300s          # 空闲超时；同时作为握手 OK 应答里的 expires_in

# ----------------------------------------------------------------------------
# 对象存储（缓存工件存放处，spec 4.3）
#
# driver=localfs（别名 fs）：本地磁盘 + HMAC 预签名 URL，由本进程 /files/
#                 提供 Range 下载。自托管/开发简单，但缓存命中流量仍走 API 端口。
# driver=s3     ：任何 S3 兼容后端的 SigV4 预签名直传——AWS S3、阿里云 OSS、
#                 腾讯 COS、Cloudflare R2 等凡暴露 S3 API 的都用这一项；
#                 客户端直连对象存储，缓存命中时 dldw 服务器零字节中转（生产推荐）。
# driver=minio  ：等价于 s3，但强制 path_style=true（MinIO 寻址约定）。
# driver=openlist：把 OpenList/AList 挂载当作存储（见下方 openlist 段）。
#
# 新增后端：实现 internal/transfer/storage.Storage 接口并在 app.go 注册。
# ----------------------------------------------------------------------------
storage:
  driver: localfs

  # --- localfs 专用 ---
  root: /var/lib/dldw/objects       # 对象根目录；相对路径基于 data_dir
  secret: change-me-to-random-32-bytes
                                    # 预签名 HMAC 密钥（>=16 字节）。
                                    # !! 生产必须换成随机值；泄露 = 任何人可下任意缓存对象

  # --- s3 / minio 专用（把 driver 切换为 s3 或 minio 时生效）---
  s3:
    # MinIO 示例（或直接 driver: minio，自动 path_style=true）：
    #   endpoint: http://minio.internal:9000
    #   region: us-east-1
    #   bucket: dldw-cache
    #   access_key: minioadmin
    #   secret_key: minioadmin
    #   path_style: true
    #
    # AWS S3 示例：
    #   endpoint: https://s3.us-east-1.amazonaws.com
    #   region: us-east-1
    #   bucket: dldw-cache
    #   access_key: "AKIA..."
    #   secret_key: "..."
    #   path_style: false
    #
    # 阿里云 OSS / 腾讯 COS / Cloudflare R2：同 AWS 形式，填各自的
    # S3 兼容 endpoint 与区域（R2 region 填 auto），path_style 按厂商文档。
    endpoint: https://s3.us-east-1.amazonaws.com
    region: us-east-1
    bucket: dldw-cache               # 建议专用桶，生命周期规则可配 TTL
    access_key: "AKIA..."            # AccessKey ID
    secret_key: "..."                # !! 仅写在服务端配置，不下发给客户端
    path_style: false                # MinIO/自建 = true；AWS 虚拟主机风格 = false

  # --- openlist 专用（把 driver 切换为 openlist 时生效）---
  # dldw 通过 OpenList 的 REST API 存取工件，下载链接用 fs/get 的 raw_url：
  #   - OpenList 挂载的是 S3/云盘类驱动：raw_url 是底层直链/预签名 URL，
  #     客户端直连底层存储下载，dldw 与 OpenList 都零中转；
  #   - 挂载的是本地/WebDAV 类驱动：raw_url 是 OpenList 的 /d/ 代理地址，
  #     字节经 OpenList 中转（Range 透传，分块下载照常工作）。
  # 注意：客户端必须能访问 base_url（或其底层直链域名）；
  #       raw_url 有效期由 OpenList/底层存储决定，客户端临期会自动 refresh。
  openlist:
    base_url: http://openlist.internal:5244   # OpenList 地址
    token: ""            # 推荐填 OpenList 后台生成的 API token
    username: admin      # token 留空时用账密登录（遇 401 自动重登）
    password: ""
    root_path: /dldw-cache   # OpenList 里的缓存根目录，建议独立目录
    dir_password: ""     # 目录签名/访问密码，一般留空

# ----------------------------------------------------------------------------
# 内嵌代理核心（sing-box 子进程托管）：服务端自带出口，无需宿主机 v2rayN。
# 启用后 executor 与隧道未显式配置 upstream_proxy 时自动指向核心的 mixed 入站。
# 启动时临时禁用：dldw serve --no-proxy-core
# ----------------------------------------------------------------------------
proxy:
  enabled: false                 # 是否启用服务端代理
  core: sing-box
  binary: /usr/local/bin/sing-box   # sing-box 可执行文件路径
  share_link: "hysteria2://password@hy.example.com:32319?sni=hy.example.com&obfs=salamander&obfs-password=xxx#node"
                                 # 目前支持 hysteria2:// 分享链接（含 hy2:// 前缀）
  listen: 127.0.0.1
  port: 1080                     # mixed 入站端口（dldw 内部使用）
  log_level: warn

# ----------------------------------------------------------------------------
# PyPI 拉穿镜像：uv / pip 的包下载全量吃服务端缓存
#   客户端无需手动配置——wrapper 检测到 uv/pip 且用户未自配 index 时自动注入：
#     dldw uv sync / dldw pip install ...   （注入 UV_INDEX_URL / PIP_INDEX_URL）
#   用户自己配置（CLI flag / 环境变量 / pyproject / pip.ini）优先，不会被覆盖。
# ----------------------------------------------------------------------------
pypi:
  enabled: true
  # index_origin: https://pypi.org    # 可指向私有 devpi/镜像
  # files_origin: https://files.pythonhosted.org
  # index_ttl: 10m                    # 索引页内存缓存 TTL

# ----------------------------------------------------------------------------
# npm 拉穿镜像：npm / pnpm / yarn 吃服务端缓存
#   wrapper 检测到 npm 系命令且用户未自配 registry 时自动注入
#   NPM_CONFIG_REGISTRY；publish/login 等写操作不走镜像。
# ----------------------------------------------------------------------------
npm:
  enabled: true
  # registry_origin: https://registry.npmjs.org
  # index_ttl: 2m                     # 元数据内存缓存 TTL

# ----------------------------------------------------------------------------
# 网络其余部分
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# 源站抓取执行器：缓存未命中时由谁去下载原始 URL
# ----------------------------------------------------------------------------
executor:
  driver: builtin                   # builtin（默认，纯 Go，带重试）| aria2
  max_bytes: 8GiB                   # 单工件大小上限；超出直接拒绝（0 = 不限）
  ports: [80, 443]                  # 允许访问源站的端口白名单（SSRF 收敛）
  # upstream_proxy: http://127.0.0.1:10808
  # 可选：源站抓取全部经上游 HTTP 代理出网（如 Xray/v2rayN 的 mixed 入站，
  # 需支持 HTTP 代理语义与 CONNECT）。启用后源站 DNS/SSRF 判定委托给代理，
  # 端口白名单仍本地强制。代理不可用时抓取会失败重试直至 dead。
  allow_loopback: false             # !! 仅本地测试（源站在 127.0.0.1）时置 true；
                                    # !! 公网部署必须 false，否则可被抓取内网资源

  aria2:                            # driver=aria2 时生效
    rpc_url: http://127.0.0.1:6800/jsonrpc
    secret: ""                      # aria2 的 rpc-secret，不带 "token:" 前缀

# ----------------------------------------------------------------------------
# 设备令牌（spec 5：设备 token 与控制面密钥分离）
# ----------------------------------------------------------------------------
auth:
  tokens_file: /var/lib/dldw/tokens.json   # 令牌库（只存哈希，可跨重启）
  token_ttl: 720h                          # 令牌有效期；客户端可 refresh 轮换
  allow_registration: true                 # POST /api/v1/token 注册开关。
                                           # 完成设备接入后建议改 false 防滥用

# ----------------------------------------------------------------------------
# 数据与运维
# ----------------------------------------------------------------------------
whitelist_file: /etc/dldw/whitelist.txt
# 隧道域名白名单（模板见 deploy/whitelist.example.txt）：
#   每行一个域名；"github.com" 同时匹配任意子域；# 开头为注释；
#   可用 "# version: 2026-09-16.1" 头部声明版本，doctor 会比对。
#   修改文件后约 30s 自动热加载，无需重启。

tasks_file: /var/lib/dldw/tasks.json   # 任务状态持久化（重启可恢复进行中的任务）
tmp_dir: /var/lib/dldw/tmp             # 任务临时下载目录；GC 定时清理孤儿文件
audit_log: ""                          # 审计日志（JSON lines）；空 = 打到 stdout
data_dir: /var/lib/dldw                # 未配置/相对路径的解析基准目录
presign_ttl: 15m                       # 预签名 URL 有效期；临期客户端自动 refresh

# block_private: true                  # 可选：执行器出口是否阻断私网目标。
                                       # 默认（缺省）即 true；loopback/link-local 无论如何都阻断
